# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Make our YAML dashboard the global default dashboard for all devices (modern 2026 syntax)
lovelace:
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Smart Home
      icon: mdi:home-automation
      show_in_sidebar: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Helpers for BILRESA Dual-Button scene rotation and hold mode
input_select:
  bedroom_scene_rotation:
    name: "Bedroom - Scene Rotation"
    options:
      - "Evening (2700K, 50%)"
      - "Reading (3500K, 80%)"
      - "Relax (2200K, 20%)"
    initial: "Evening (2700K, 50%)"
    icon: mdi:palette-swatch-outline

  bedroom_hold_mode:
    name: "Bedroom - BILRESA Hold Mode"
    options:
      - "Brightness"
      - "Color Temperature"
    initial: "Brightness"
    icon: mdi:tune-vertical

  bedroom_active_scene:
    name: "ÅRSTID Lighting Scenes"
    options:
      - "Afternoon (80%, 3300K)"
      - "Evening (50%, 2700K)"
      - "Reading (80%, 3500K)"
      - "Relax (20%, 2200K)"
      - "Night Mode (3%, 2200K)"
    initial: "Afternoon (80%, 3300K)"
    icon: mdi:palette-swatch-outline

  office_scene_rotation:
    name: "Office - Scene Rotation"
    options:
      - "Focus / Work (4000K, 95%)"
      - "Afternoon (3300K, 80%)"
      - "Evening (2500K, 40%)"
    initial: "Focus / Work (4000K, 95%)"
    icon: mdi:desk-lamp

# Fast local target accumulators for smooth consecutive BILRESA Scroll Wheel spins
input_number:
  office_wheel_brightness:
    name: "Office Wheel Target Brightness"
    min: 2
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-6

  office_wheel_kelvin:
    name: "Office Wheel Target Color Temp"
    min: 2202
    max: 4500
    step: 1
    unit_of_measurement: "K"
    icon: mdi:thermometer-lines

# Sunrise Wake-Up Alarm Helpers
input_boolean:
  bedroom_wake_up_enabled:
    name: "Bedroom Wake-Up Alarm"
    icon: mdi:weather-sunset-up

input_datetime:
  bedroom_wake_up_time:
    name: "Bedroom Wake-Up Time"
    has_date: false
    has_time: true
    initial: "07:00:00"
    icon: mdi:alarm

# Light group for the ÅRSTID Bedside Lamps
light:
  - platform: group
    unique_id: group_bedroom_bedside_lamps
    name: "Bedroom Bedside Lamps"
    entities:
      - light.kajplats_e27_ws_globe_1055lm
      - light.kajplats_e27_ws_globe_1055lm_2

# Host Server Hardware Monitoring (Intel RAPL Power & CPU Temp)
command_line:
  - sensor:
      name: "Server CPU Power"
      unique_id: server_cpu_power_watts
      command: >-
        sh -c 'a=$(cat /sys/class/powercap/intel-rapl:0/energy_uj); sleep 1; b=$(cat /sys/class/powercap/intel-rapl:0/energy_uj); awk "BEGIN {d=$b-$a; if (d>=0) printf \"%.2f\", d/1000000; else printf \"2.50\"}"'
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      scan_interval: 30

  - sensor:
      name: "Server CPU Temperature"
      unique_id: server_cpu_temperature_c
      command: "awk '{printf \"%.1f\", $1 / 1000}' /sys/class/thermal/thermal_zone0/temp"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      scan_interval: 30

template:
  - button:
      - name: "Turn Off All Lights"
        unique_id: turn_off_all_apartment_lights
        icon: mdi:lightbulb-group-off-outline
        press:
          - action: light.turn_off
            target:
              entity_id: all
            data:
              transition: 0.8

  - sensor:
      - name: "Server Total Power"
        unique_id: server_total_power_watts
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:server-network
        state: >-
          {{ (states('sensor.server_cpu_power') | float(2.5) + 6.0) | round(2) }}

# Cumulative Energy (kWh) for Home Assistant Energy Dashboard
sensor:
  - platform: integration
    source: sensor.server_total_power
    name: "Server Energy Consumption"
    unique_id: server_energy_consumption_kwh
    unit_prefix: k
    unit_time: h
    method: left
    round: 3
