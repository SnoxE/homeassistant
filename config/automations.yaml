              data:
                value: 2500
            - action: light.turn_on
              target:
                entity_id: light.office_kajplats_e27_1521lm_office
              data:
                brightness_pct: 40
                color_temp_kelvin: 2500
                transition: 0.4
  mode: restart

- id: office_bilresa_scroll_wheel_brightness_handler
  alias: "Office - BILRESA Scroll Wheel Channel 1 (1 Dot): Predictive Hardware Ramp + Notch Lock"
  description: "Pure YAML: Immediately starts a smooth 24%/s hardware ramp the moment current_switch_position_1/2 turns to 1 (so the light glides live while turning), then locks onto the exact notch count (ticks * 6%) when multi_press_1..8 arrives"
  triggers:
    # 1. Instant start-of-turn trigger (~150ms): starts smooth hardware ramp while finger is turning
    - trigger: state
      id: ramp_right
      entity_id: sensor.bilresa_scroll_wheel_current_switch_position_1
      to: "1"
    - trigger: state
      id: ramp_left
      entity_id: sensor.bilresa_scroll_wheel_current_switch_position_2
      to: "1"
    # 2. Direct fallback trigger in case current_switch_position was already 1
    - trigger: state
      id: batch_right
      entity_id: event.bilresa_scroll_wheel_button_1
      not_from:
        - unavailable
        - unknown
    - trigger: state
      id: batch_left
      entity_id: event.bilresa_scroll_wheel_button_2
      not_from:
        - unavailable
        - unknown
  actions:
    - variables:
        is_ramp_start: "{{ trigger.id in ['ramp_right', 'ramp_left'] }}"
        direction: "{{ 1 if trigger.id in ['ramp_right', 'batch_right'] else -1 }}"
        recent_spin: >-
          {{ (as_timestamp(now()) - as_timestamp(states.input_number.office_wheel_brightness.last_updated, 0)) < 2.0 }}
        current_bulb_pct: >-
          {{ ((state_attr('light.office_kajplats_e27_1521lm_office', 'brightness') | int(0)) * 100 / 255) | round(0) }}
        start_pct: >-
          {{ (states('input_number.office_wheel_brightness') | int(50)) if recent_spin else current_bulb_pct }}
    - choose:
        # Case A: Wheel just started turning -> immediately start smooth hardware ramp (24%/s) and wait for final notch count
        - conditions:
            - condition: template
              value_template: "{{ is_ramp_start }}"
          sequence:
            - variables:
                limit_pct: "{{ 100 if direction == 1 else 2 }}"
                ramp_duration: "{{ [(((limit_pct - start_pct) | abs) / 24.0) | round(2), 0.3] | max }}"
                ev_entity: >-
                  {{ 'event.bilresa_scroll_wheel_button_1' if direction == 1 else 'event.bilresa_scroll_wheel_button_2' }}
            - action: light.turn_on
              target:
                entity_id: light.office_kajplats_e27_1521lm_office
              data:
                brightness_pct: "{{ limit_pct }}"
                transition: "{{ ramp_duration }}"
            - wait_for_trigger:
                - trigger: state
                  entity_id:
                    - event.bilresa_scroll_wheel_button_1
                    - event.bilresa_scroll_wheel_button_2
              timeout:
                milliseconds: 2000
            - variables:
                ev_type: "{{ (state_attr(ev_entity, 'event_type') | string) if wait.completed else 'multi_press_1' }}"
                ticks: "{{ (ev_type.split('_')[-1] | int(1)) if 'multi_press_' in ev_type else 1 }}"
                final_pct: "{{ [[start_pct + (direction * ticks * 6), 100] | min, 2] | max }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.office_wheel_brightness
              data:
                value: "{{ final_pct }}"
            - action: light.turn_on
              target:
                entity_id: light.office_kajplats_e27_1521lm_office
              data:
                brightness_pct: "{{ final_pct }}"
                transition: 0.25

      # Case B: multi_press_N arrived without a prior ramp_start
      default:
        - variables:
            ev_type: "{{ state_attr(trigger.entity_id, 'event_type') | string }}"
            ticks: "{{ (ev_type.split('_')[-1] | int(1)) if 'multi_press_' in ev_type else 1 }}"
            final_pct: "{{ [[start_pct + (direction * ticks * 6), 100] | min, 2] | max }}"
            trans: "{{ [[(ticks * 0.12) | round(2), 0.25] | max, 0.7] | min }}"
        - action: input_number.set_value
          target:
            entity_id: input_number.office_wheel_brightness
          data:
            value: "{{ final_pct }}"
        - action: light.turn_on
          target:
            entity_id: light.office_kajplats_e27_1521lm_office
          data:
            brightness_pct: "{{ final_pct }}"
            transition: "{{ trans }}"
  mode: restart

- id: office_bilresa_scroll_wheel_colortemp_handler
  alias: "Office - BILRESA Scroll Wheel Channel 2 (2 Dots): Predictive Hardware Ramp + Notch Lock"
  description: "Pure YAML: Immediately starts a smooth 600K/s hardware ramp the moment current_switch_position_4/5 turns to 1, then locks onto the exact notch count (ticks * 150K) when multi_press_1..8 arrives"
  triggers:
    - trigger: state
      id: ramp_right
      entity_id: sensor.bilresa_scroll_wheel_current_switch_position_4
      to: "1"
    - trigger: state
      id: ramp_left
      entity_id: sensor.bilresa_scroll_wheel_current_switch_position_5
      to: "1"
    - trigger: state
      id: batch_right
      entity_id: event.bilresa_scroll_wheel_button_4
      not_from:
        - unavailable
        - unknown
    - trigger: state
      id: batch_left
      entity_id: event.bilresa_scroll_wheel_button_5
      not_from:
        - unavailable
        - unknown
  actions:
    - variables:
        is_ramp_start: "{{ trigger.id in ['ramp_right', 'ramp_left'] }}"
