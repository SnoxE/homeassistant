# ==============================================================================
# BEDROOM AUTOMATIONS - IKEA BILRESA Dual Button Remote (ÅRSTID Bedside Lamps)
# ==============================================================================

- id: bedroom_bilresa_dual_button_1_handler
  alias: "Bedroom - BILRESA Button I (Top): Afternoon / Combo Mode Toggle / Rotate Scenes / Hold Ramp Up"
  description: "Single click: Afternoon (80%, 3300K) | Simultaneous I+O click: Toggle Hold Mode (Brightness <-> Color Temp) | Double click: Rotate Evening -> Reading -> Relax | Hold: Hardware smooth brighten or cooler color temp"
  triggers:
    - trigger: state
      entity_id: event.bilresa_dual_button_button_1
      not_from:
        - unavailable
        - unknown
  conditions:
    - condition: template
      value_template: "{{ state_attr('event.bilresa_dual_button_button_1', 'event_type') in ['multi_press_1', 'multi_press_2', 'long_press'] }}"
  actions:
    - variables:
        ev_type: "{{ state_attr('event.bilresa_dual_button_button_1', 'event_type') }}"
    - choose:
        # 1. Single Click -> Check for simultaneous I+O combo (within 350ms); otherwise Afternoon Scene (80%, 3300K)
        - conditions:
            - condition: template
              value_template: "{{ ev_type == 'multi_press_1' }}"
          sequence:
            - variables:
                b2_already_pressed: >-
                  {{ state_attr('event.bilresa_dual_button_button_2', 'event_type') == 'multi_press_1'
                     and (as_timestamp(now()) - as_timestamp(states('event.bilresa_dual_button_button_2'), 0)) < 0.45 }}
            - if:
                - condition: template
                  value_template: "{{ not b2_already_pressed }}"
              then:
                - wait_for_trigger:
                    - trigger: state
                      entity_id: event.bilresa_dual_button_button_2
                  timeout:
                    milliseconds: 350
            - if:
                - condition: template
                  value_template: "{{ b2_already_pressed or wait.completed }}"
              then:
                # Simultaneous I + O Click -> Toggle Hold Mode (Brightness <-> Color Temperature)
                - action: input_select.select_next
                  target:
                    entity_id: input_select.bedroom_hold_mode
                  data:
                    cycle: true
                # Subtle visual confirmation pulse if lamp is on
                - if:
                    - condition: state
                      entity_id: light.bedroom_bedside_lamps
                      state: "on"
                  then:
                    - variables:
                        cur_pct: "{{ ((state_attr('light.bedroom_bedside_lamps', 'brightness') | int(128)) * 100 / 255) | round(0) }}"
                        dip_pct: "{{ [cur_pct - 18, 25] | max if cur_pct > 25 else cur_pct + 20 }}"
                    - action: light.turn_on
                      target:
                        entity_id: light.bedroom_bedside_lamps
                      data:
                        brightness_pct: "{{ dip_pct }}"
                        transition: 0.12
                    - delay:
                        milliseconds: 160
                    - action: light.turn_on
                      target:
                        entity_id: light.bedroom_bedside_lamps
                      data:
                        brightness_pct: "{{ cur_pct }}"
                        transition: 0.12
              else:
                # Normal Single Click on I -> Afternoon Scene (80%, 3300K)
                - action: light.turn_on
                  target:
                    entity_id: light.bedroom_bedside_lamps
                  data:
                    brightness_pct: 80
                    color_temp_kelvin: 3300
                    transition: 0.4

        # 2. Double Click -> Rotate Scenes: Evening (2700K, 50%) -> Reading (3500K, 80%) -> Relax (2200K, 20%)
        - conditions:
            - condition: template
              value_template: "{{ ev_type == 'multi_press_2' }}"
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_select.bedroom_scene_rotation
                      state: "Evening (2700K, 50%)"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: light.bedroom_bedside_lamps
                      data:
                        brightness_pct: 50
                        color_temp_kelvin: 2700
                        transition: 0.4
                    - action: input_select.select_option
                      target:
                        entity_id: input_select.bedroom_scene_rotation
                      data:
                        option: "Reading (3500K, 80%)"
                - conditions:
                    - condition: state
                      entity_id: input_select.bedroom_scene_rotation
                      state: "Reading (3500K, 80%)"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: light.bedroom_bedside_lamps
                      data:
                        brightness_pct: 80
                        color_temp_kelvin: 3500
                        transition: 0.4
                    - action: input_select.select_option
                      target:
                        entity_id: input_select.bedroom_scene_rotation
                      data:
                        option: "Relax (2200K, 20%)"
              default:
                - action: light.turn_on
                  target:
                    entity_id: light.bedroom_bedside_lamps
                  data:
                    brightness_pct: 20
                    color_temp_kelvin: 2200
                    transition: 0.4
                - action: input_select.select_option
                  target:
                    entity_id: input_select.bedroom_scene_rotation
                  data:
                    option: "Evening (2700K, 50%)"

        # 3. Hold (long_press) -> Native hardware smooth ramp (Brightness up to 100% OR Color Temp up to 4500K)
        - conditions:
            - condition: template
              value_template: "{{ ev_type == 'long_press' }}"
          sequence:
            - choose:
                # Mode A: Color Temperature Mode (Ramp warmer -> cooler up to 4500K)
                - conditions:
                    - condition: state
                      entity_id: input_select.bedroom_hold_mode
                      state: "Color Temperature"
                  sequence:
                    - variables:
                        start_k: "{{ state_attr('light.bedroom_bedside_lamps', 'color_temp_kelvin') | int(2700) }}"
                        max_k: 4500
                        ramp_rate_k: 1000.0
                        duration: "{{ [((max_k - start_k) / ramp_rate_k) | round(2), 0.2] | max }}"
                        start_ts: "{{ as_timestamp(now()) }}"
                    - action: light.turn_on
                      target:
                        entity_id: light.bedroom_bedside_lamps
                      data:
                        color_temp_kelvin: "{{ max_k }}"
                        transition: "{{ duration }}"
                    - wait_for_trigger:
                        - trigger: state
                          entity_id: event.bilresa_dual_button_button_1
                      timeout:
                        milliseconds: "{{ (duration * 1000) | int }}"
                    - if:
                        - condition: template
                          value_template: "{{ wait.completed }}"
                      then:
                        - variables:
                            elapsed: "{{ [as_timestamp(now()) - start_ts, 0] | max }}"
                            stop_k: "{{ [[(start_k + (elapsed * ramp_rate_k)) | round(0), max_k] | min, 2202] | max }}"
                        - action: light.turn_on
                          target:
                            entity_id: light.bedroom_bedside_lamps
                          data:
                            color_temp_kelvin: "{{ stop_k }}"
                            transition: 0
              # Mode B (Default): Brightness Mode (Ramp up to 100%)
              default:
                - variables:
                    start_pct: "{{ ((state_attr('light.bedroom_bedside_lamps', 'brightness') | int(0)) * 100 / 255) | round(0) }}"
                    ramp_rate: 45.0
                    duration: "{{ [((100 - start_pct) / ramp_rate) | round(2), 0.2] | max }}"
                    start_ts: "{{ as_timestamp(now()) }}"
                - action: light.turn_on
                  target:
                    entity_id: light.bedroom_bedside_lamps
                  data:
                    brightness_pct: 100
                    transition: "{{ duration }}"
                - wait_for_trigger:
                    - trigger: state
                      entity_id: event.bilresa_dual_button_button_1
                  timeout:
                    milliseconds: "{{ (duration * 1000) | int }}"
                - if:
                    - condition: template
                      value_template: "{{ wait.completed }}"
                  then:
                    - variables:
                        elapsed: "{{ [as_timestamp(now()) - start_ts, 0] | max }}"
                        stop_pct: "{{ [[(start_pct + (elapsed * ramp_rate)) | round(0), 100] | min, 2] | max }}"
                    - action: light.turn_on
                      target:
                        entity_id: light.bedroom_bedside_lamps
                      data:
                        brightness_pct: "{{ stop_pct }}"
                        transition: 0
  mode: restart

- id: bedroom_bilresa_dual_button_2_handler
  alias: "Bedroom - BILRESA Button O (Bottom): Turn Off / Night Mode / Hold Ramp Down"
  description: "Single click: Turn off bedside lamps (unless I+O combo) | Double click: Night Mode (3%, 2200K) | Hold: Hardware smooth dim or warmer color temp"
  triggers:
    - trigger: state
      entity_id: event.bilresa_dual_button_button_2
      not_from:
        - unavailable
        - unknown
  conditions:
    - condition: template
      value_template: "{{ state_attr('event.bilresa_dual_button_button_2', 'event_type') in ['multi_press_1', 'multi_press_2', 'long_press'] }}"
  actions:
    - variables:
        ev_type: "{{ state_attr('event.bilresa_dual_button_button_2', 'event_type') }}"
    - choose:
        # 1. Single Click -> Suppress if simultaneous I+O combo (within 350ms); otherwise Turn Off bedside lamps (0.8s)
        - conditions:
            - condition: template
              value_template: "{{ ev_type == 'multi_press_1' }}"
          sequence:
            - variables:
                b1_already_pressed: >-
                  {{ state_attr('event.bilresa_dual_button_button_1', 'event_type') == 'multi_press_1'
                     and (as_timestamp(now()) - as_timestamp(states('event.bilresa_dual_button_button_1'), 0)) < 0.45 }}
            - if:
                - condition: template
                  value_template: "{{ not b1_already_pressed }}"
              then:
                - wait_for_trigger:
                    - trigger: state
                      entity_id: event.bilresa_dual_button_button_1
                  timeout:
                    milliseconds: 350
                - if:
                    - condition: template
                      value_template: "{{ not wait.completed }}"
                  then:
                    - action: light.turn_off
                      target:
                        entity_id: light.bedroom_bedside_lamps
                      data:
                        transition: 0.8

        # 2. Double Click -> Night Mode on bedside lamps (3%, 2200K) + corner floor lamp (20% brightness, keep current color)
        - conditions:
            - condition: template
              value_template: "{{ ev_type == 'multi_press_2' }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.bedroom_bedside_lamps
              data:
                brightness_pct: 3
                color_temp_kelvin: 2200
                transition: 0.5
            - action: light.turn_on
              target:
                entity_id: light.sypialnia_floor_lamp_corner
              data:
                brightness_pct: 20
                transition: 0.5

        # 3. Hold (long_press) -> Native hardware smooth ramp down (Brightness down to 2% OR Color Temp down to 2202K)
        - conditions:
            - condition: template
              value_template: "{{ ev_type == 'long_press' }}"
          sequence:
            - choose:
                # Mode A: Color Temperature Mode (Ramp cooler -> warmer down to 2202K)
                - conditions:
                    - condition: state
                      entity_id: input_select.bedroom_hold_mode
                      state: "Color Temperature"
                  sequence:
                    - variables:
                        start_k: "{{ state_attr('light.bedroom_bedside_lamps', 'color_temp_kelvin') | int(3300) }}"
                        min_k: 2202
                        ramp_rate_k: 1000.0
                        duration: "{{ [((start_k - min_k) / ramp_rate_k) | round(2), 0.2] | max }}"
                        start_ts: "{{ as_timestamp(now()) }}"
                    - if:
                        - condition: template
                          value_template: "{{ start_k > min_k }}"
                      then:
                        - action: light.turn_on
                          target:
                            entity_id: light.bedroom_bedside_lamps
                          data:
                            color_temp_kelvin: "{{ min_k }}"
                            transition: "{{ duration }}"
                        - wait_for_trigger:
                            - trigger: state
                              entity_id: event.bilresa_dual_button_button_2
                          timeout:
                            milliseconds: "{{ (duration * 1000) | int }}"
                        - if:
                            - condition: template
                              value_template: "{{ wait.completed }}"
                          then:
                            - variables:
                                elapsed: "{{ [as_timestamp(now()) - start_ts, 0] | max }}"
                                stop_k: "{{ [[(start_k - (elapsed * ramp_rate_k)) | round(0), 4500] | min, min_k] | max }}"
                            - action: light.turn_on
                              target:
                                entity_id: light.bedroom_bedside_lamps
                              data:
                                color_temp_kelvin: "{{ stop_k }}"
                                transition: 0
              # Mode B (Default): Brightness Mode (Ramp down to 2%)
              default:
                - variables:
                    start_pct: "{{ ((state_attr('light.bedroom_bedside_lamps', 'brightness') | int(0)) * 100 / 255) | round(0) }}"
                    ramp_rate: 45.0
                    duration: "{{ [((start_pct - 2) / ramp_rate) | round(2), 0.2] | max }}"
                    start_ts: "{{ as_timestamp(now()) }}"
                - if:
                    - condition: template
                      value_template: "{{ start_pct > 2 }}"
                  then:
                    - action: light.turn_on
                      target:
                        entity_id: light.bedroom_bedside_lamps
                      data:
                        brightness_pct: 2
                        transition: "{{ duration }}"
                    - wait_for_trigger:
                        - trigger: state
                          entity_id: event.bilresa_dual_button_button_2
                      timeout:
                        milliseconds: "{{ (duration * 1000) | int }}"
                    - if:
                        - condition: template
                          value_template: "{{ wait.completed }}"
                      then:
                        - variables:
                            elapsed: "{{ [as_timestamp(now()) - start_ts, 0] | max }}"
                            stop_pct: "{{ [[(start_pct - (elapsed * ramp_rate)) | round(0), 100] | min, 2] | max }}"
                        - action: light.turn_on
                          target:
                            entity_id: light.bedroom_bedside_lamps
                          data:
                            brightness_pct: "{{ stop_pct }}"
                            transition: 0
  mode: restart

- id: bedroom_active_scene_dropdown_handler
  alias: "Bedroom - Dashboard ÅRSTID Scene Selector"
  description: "Activates the selected ÅRSTID lighting scene when chosen from the expandable dashboard tile"
  triggers:
    - trigger: state
      entity_id: input_select.bedroom_active_scene
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.bedroom_active_scene
              state: "Afternoon (80%, 3300K)"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.bedroom_bedside_lamps
              data:
                brightness_pct: 80
                color_temp_kelvin: 3300
                transition: 0.4
        - conditions:
            - condition: state
              entity_id: input_select.bedroom_active_scene
              state: "Evening (50%, 2700K)"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.bedroom_bedside_lamps
              data:
                brightness_pct: 50
                color_temp_kelvin: 2700
                transition: 0.4
        - conditions:
            - condition: state
              entity_id: input_select.bedroom_active_scene
              state: "Reading (80%, 3500K)"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.bedroom_bedside_lamps
              data:
                brightness_pct: 80
                color_temp_kelvin: 3500
                transition: 0.4
        - conditions:
            - condition: state
              entity_id: input_select.bedroom_active_scene
              state: "Relax (20%, 2200K)"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.bedroom_bedside_lamps
              data:
                brightness_pct: 20
                color_temp_kelvin: 2200
                transition: 0.4
        - conditions:
            - condition: state
              entity_id: input_select.bedroom_active_scene
              state: "Night Mode (3%, 2200K)"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.bedroom_bedside_lamps
              data:
                brightness_pct: 3
                color_temp_kelvin: 2200
                transition: 0.5
            - action: light.turn_on
              target:
                entity_id: light.sypialnia_floor_lamp_corner
              data:
                brightness_pct: 20
                transition: 0.5
  mode: restart

- id: bedroom_sunrise_wake_up_alarm
  alias: "Bedroom - Sunrise Wake-Up Light (0% to 50% at 2202K over 3 Minutes)"
  description: "At the set alarm time (when enabled), smoothly fades both ÅRSTID lamps and the corner floor lamp from 1% warmest amber (2202K) up to 50% over 3 minutes (180s). Stops immediately if alarm is turned off or lights are turned off via BILRESA remote."
  triggers:
    - trigger: time
      at: input_datetime.bedroom_wake_up_time
  conditions:
    - condition: state
      entity_id: input_boolean.bedroom_wake_up_enabled
      state: "on"
  actions:
    # Step 0: Start from lowest brightness (1%) and warmest color temperature (2202K)
    - action: light.turn_on
      target:
        entity_id:
          - light.bedroom_bedside_lamps
          - light.sypialnia_floor_lamp_corner
      data:
        brightness_pct: 1
        color_temp_kelvin: 2202
        transition: 1
    - delay:
        seconds: 2
    # 18 smooth hardware-interpolated segments of 10s each = 180 seconds (3 minutes) up to 50%
    - repeat:
        while:
          - condition: template
            value_template: "{{ repeat.index <= 18 }}"
          - condition: state
            entity_id: input_boolean.bedroom_wake_up_enabled
            state: "on"
          - condition: state
            entity_id: light.bedroom_bedside_lamps
            state: "on"
        sequence:
          - variables:
              target_pct: "{{ (1 + (repeat.index * 49 / 18)) | round(0) }}"
          - action: light.turn_on
            target:
              entity_id:
                - light.bedroom_bedside_lamps
                - light.sypialnia_floor_lamp_corner
            data:
              brightness_pct: "{{ target_pct }}"
              color_temp_kelvin: 2202
              transition: 9.5
          - delay:
              seconds: 10
  mode: restart

# ==============================================================================
# OFFICE AUTOMATIONS - IKEA BILRESA Scroll Wheel Remote (Office Light 1521lm)
# ==============================================================================
# Channel 1 (1 LED dot): button_1 (Scroll Right = Brighten), button_2 (Scroll Left = Dim), button_3 (Click)
# Channel 2 (2 LED dots): button_4 (Scroll Right = Cooler K), button_5 (Scroll Left = Warmer K), button_6 (Click)
# Channel 3 (3 LED dots): button_9 (Click also works on Channel 3)

- id: office_bilresa_scroll_wheel_click_handler
  alias: "Office - BILRESA Scroll Wheel Click: Toggle (1x) & Scene Rotation (2x)"
  description: "Single click on any channel: Toggle Office light | Double click: Rotate Focus (4000K, 95%) -> Afternoon (3300K, 80%) -> Evening (2500K, 40%)"
  triggers:
    - trigger: state
      entity_id:
        - event.bilresa_scroll_wheel_button_3
        - event.bilresa_scroll_wheel_button_6
        - event.bilresa_scroll_wheel_button_9
      not_from:
        - unavailable
        - unknown
  actions:
    - variables:
        ev_type: "{{ state_attr(trigger.entity_id, 'event_type') }}"
    - choose:
        # 1. Single Click -> Toggle Office Light On (Afternoon 80%, 3300K) / Off (0.6s fade)
        - conditions:
            - condition: template
              value_template: "{{ ev_type == 'multi_press_1' }}"
          sequence:
            - if:
                - condition: state
                  entity_id: light.office_kajplats_e27_1521lm_office
                  state: "on"
              then:
                - action: light.turn_off
                  target:
                    entity_id: light.office_kajplats_e27_1521lm_office
                  data:
                    transition: 0.6
              else:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.office_wheel_brightness
                  data:
                    value: 80
                - action: input_number.set_value
                  target:
                    entity_id: input_number.office_wheel_kelvin
                  data:
                    value: 3300
                - action: light.turn_on
                  target:
                    entity_id: light.office_kajplats_e27_1521lm_office
                  data:
                    brightness_pct: 80
                    color_temp_kelvin: 3300
                    transition: 0.4

        # 2. Double Click -> Advance Office Scene (Focus -> Afternoon -> Evening)
        - conditions:
            - condition: template
              value_template: "{{ ev_type == 'multi_press_2' }}"
          sequence:
            - action: input_select.select_next
              target:
                entity_id: input_select.office_scene_rotation
              data:
                cycle: true
  mode: restart

- id: office_active_scene_dropdown_handler
  alias: "Office - Dashboard & Wheel Scene Selector"
  description: "Applies the selected Office lighting scene immediately when chosen in the app or rotated via double-click on the BILRESA wheel"
  triggers:
    - trigger: state
      entity_id: input_select.office_scene_rotation
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.office_scene_rotation
              state: "Focus / Work (4000K, 95%)"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.office_wheel_brightness
              data:
                value: 95
            - action: input_number.set_value
              target:
                entity_id: input_number.office_wheel_kelvin
              data:
                value: 4000
            - action: light.turn_on
              target:
                entity_id: light.office_kajplats_e27_1521lm_office
              data:
                brightness_pct: 95
                color_temp_kelvin: 4000
                transition: 0.4

        - conditions:
            - condition: state
              entity_id: input_select.office_scene_rotation
              state: "Afternoon (3300K, 80%)"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.office_wheel_brightness
              data:
                value: 80
            - action: input_number.set_value
              target:
                entity_id: input_number.office_wheel_kelvin
              data:
                value: 3300
            - action: light.turn_on
              target:
                entity_id: light.office_kajplats_e27_1521lm_office
              data:
                brightness_pct: 80
                color_temp_kelvin: 3300
                transition: 0.4

        - conditions:
            - condition: state
              entity_id: input_select.office_scene_rotation
              state: "Evening (2500K, 40%)"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.office_wheel_brightness
              data:
                value: 40
            - action: input_number.set_value
              target:
                entity_id: input_number.office_wheel_kelvin
              data:
                value: 2500
            - action: light.turn_on
              target:
                entity_id: light.office_kajplats_e27_1521lm_office
              data:
                brightness_pct: 40
                color_temp_kelvin: 2500
                transition: 0.4
  mode: restart

- id: office_bilresa_scroll_wheel_brightness_handler
  alias: "Office - BILRESA Scroll Wheel Channel 1 (1 Dot): Hybrid Instant + Proportional Brightness"
  description: "Pure YAML Hybrid Engine: current_switch_position_1/2 triggers instant 1st notch (±5% in ~150ms), while button_1/2 multi_press_2..8 applies remaining notches on fast spins"
  triggers:
    # Instant trigger (~150ms) the moment the wheel starts turning
    - trigger: state
      id: instant_right
      entity_id: sensor.bilresa_scroll_wheel_current_switch_position_1
      to: "1"
    - trigger: state
      id: instant_left
      entity_id: sensor.bilresa_scroll_wheel_current_switch_position_2
      to: "1"
    # Multi-notch catch-up trigger when spinning 2..8 notches in one motion
    - trigger: state
      id: batch_right
      entity_id: event.bilresa_scroll_wheel_button_1
      not_from:
        - unavailable
        - unknown
    - trigger: state
      id: batch_left
      entity_id: event.bilresa_scroll_wheel_button_2
      not_from:
        - unavailable
        - unknown
  actions:
    - variables:
        is_instant: "{{ trigger.id in ['instant_right', 'instant_left'] }}"
        direction: "{{ 1 if trigger.id in ['instant_right', 'batch_right'] else -1 }}"
        ev_type: "{{ (state_attr(trigger.entity_id, 'event_type') | string) if not is_instant else 'instant' }}"
        raw_ticks: "{{ (ev_type.split('_')[-1] | int(1)) if 'multi_press_' in ev_type else 1 }}"
        # If current_switch_position_1/2 is enabled, it already applied 1 notch instantly, so batch only applies (raw_ticks - 1).
        # If current_switch_position_1/2 is still disabled, fallback to full raw_ticks so it always works!
        pos_sensor: >-
          {{ 'sensor.bilresa_scroll_wheel_current_switch_position_1' if direction == 1 else 'sensor.bilresa_scroll_wheel_current_switch_position_2' }}
        pos_enabled: "{{ states(pos_sensor) not in ['unavailable', 'unknown'] }}"
        effective_ticks: >-
          {{ 1 if is_instant else ((raw_ticks - 1) if pos_enabled else raw_ticks) }}
    - if:
        - condition: template
          value_template: "{{ effective_ticks > 0 }}"
      then:
        - variables:
            recent_spin: >-
              {{ (as_timestamp(now()) - as_timestamp(states.input_number.office_wheel_brightness.last_updated, 0)) < 2.5 }}
            current_bulb_pct: >-
              {{ ((state_attr('light.office_kajplats_e27_1521lm_office', 'brightness') | int(0)) * 100 / 255) | round(0) }}
            base_pct: >-
              {{ (states('input_number.office_wheel_brightness') | int(50)) if recent_spin else current_bulb_pct }}
            new_pct: "{{ [[base_pct + (direction * effective_ticks * 5), 100] | min, 2] | max }}"
            trans: "{{ 0.18 if is_instant else ([[(effective_ticks * 0.12) | round(2), 0.22] | max, 0.7] | min) }}"
        - action: input_number.set_value
          target:
            entity_id: input_number.office_wheel_brightness
          data:
            value: "{{ new_pct }}"
        - action: light.turn_on
          target:
            entity_id: light.office_kajplats_e27_1521lm_office
          data:
            brightness_pct: "{{ new_pct }}"
            transition: "{{ trans }}"
  mode: queued
  max: 25

- id: office_bilresa_scroll_wheel_colortemp_handler
  alias: "Office - BILRESA Scroll Wheel Channel 2 (2 Dots): Hybrid Instant + Proportional Color Temp"
  description: "Pure YAML Hybrid Engine: current_switch_position_4/5 triggers instant 1st notch (±125K in ~150ms), while button_4/5 multi_press_2..8 applies remaining notches on fast spins"
  triggers:
    # Instant trigger (~150ms) the moment the wheel starts turning
    - trigger: state
      id: instant_right
      entity_id: sensor.bilresa_scroll_wheel_current_switch_position_4
      to: "1"
    - trigger: state
      id: instant_left
      entity_id: sensor.bilresa_scroll_wheel_current_switch_position_5
      to: "1"
    # Multi-notch catch-up trigger when spinning 2..8 notches in one motion
    - trigger: state
      id: batch_right
      entity_id: event.bilresa_scroll_wheel_button_4
      not_from:
        - unavailable
        - unknown
    - trigger: state
      id: batch_left
      entity_id: event.bilresa_scroll_wheel_button_5
      not_from:
        - unavailable
        - unknown
  actions:
    - variables:
        is_instant: "{{ trigger.id in ['instant_right', 'instant_left'] }}"
        direction: "{{ 1 if trigger.id in ['instant_right', 'batch_right'] else -1 }}"
        ev_type: "{{ (state_attr(trigger.entity_id, 'event_type') | string) if not is_instant else 'instant' }}"
        raw_ticks: "{{ (ev_type.split('_')[-1] | int(1)) if 'multi_press_' in ev_type else 1 }}"
        pos_sensor: >-
          {{ 'sensor.bilresa_scroll_wheel_current_switch_position_4' if direction == 1 else 'sensor.bilresa_scroll_wheel_current_switch_position_5' }}
        pos_enabled: "{{ states(pos_sensor) not in ['unavailable', 'unknown'] }}"
        effective_ticks: >-
          {{ 1 if is_instant else ((raw_ticks - 1) if pos_enabled else raw_ticks) }}
    - if:
        - condition: template
          value_template: "{{ effective_ticks > 0 }}"
      then:
        - variables:
            recent_spin: >-
              {{ (as_timestamp(now()) - as_timestamp(states.input_number.office_wheel_kelvin.last_updated, 0)) < 2.5 }}
            current_bulb_k: >-
              {{ state_attr('light.office_kajplats_e27_1521lm_office', 'color_temp_kelvin') | int(3300) }}
            base_k: >-
              {{ (states('input_number.office_wheel_kelvin') | int(3300)) if recent_spin else current_bulb_k }}
            new_k: "{{ [[base_k + (direction * effective_ticks * 125), 4500] | min, 2202] | max }}"
            trans: "{{ 0.18 if is_instant else ([[(effective_ticks * 0.12) | round(2), 0.22] | max, 0.7] | min) }}"
        - action: input_number.set_value
          target:
            entity_id: input_number.office_wheel_kelvin
          data:
            value: "{{ new_k }}"
        - action: light.turn_on
          target:
            entity_id: light.office_kajplats_e27_1521lm_office
          data:
            color_temp_kelvin: "{{ new_k }}"
            transition: "{{ trans }}"
  mode: queued
  max: 25
