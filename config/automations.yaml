            ticks: "{{ (ev_type.split('_')[-1] | int(1)) if 'multi_press_' in ev_type else 1 }}"
            final_k: "{{ [[start_k + (direction * ticks * 150), 4500] | min, 2202] | max }}"
            trans: "{{ [[(ticks * 0.12) | round(2), 0.25] | max, 0.7] | min }}"
        - action: input_number.set_value
          target:
            entity_id: input_number.office_wheel_kelvin
          data:
            value: "{{ final_k }}"
        - action: light.turn_on
